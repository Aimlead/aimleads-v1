services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_APP_BUILD_TIME: ${APP_BUILD_TIME:-local-build}
        BUILD_APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    # Never try to pull this image from a registry (it only exists locally).
    # Hostinger's Docker panel runs `compose pull` before deploying; without
    # this it fails with "pull access denied for aimleads".
    pull_policy: build
    container_name: aimleads
    restart: unless-stopped
    # Secrets and runtime config loaded from .env file (never commit .env)
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_PORT=3010
      - TRUST_PROXY=1
      - APP_ORIGIN=https://aimlead.io
      - CORS_ORIGIN=https://aimlead.io,https://www.aimlead.io
      - DATA_PROVIDER=supabase
      - AUTH_PROVIDER=supabase
      - ENABLE_DEMO_BOOTSTRAP=false
      - ENABLE_API_DOCS=false
      - SUPABASE_FALLBACK_TO_LOCAL=false
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-local-build}
      - APP_COMMIT_SHA=${APP_COMMIT_SHA:-local}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://aimlead.io}
    ports:
      # Local-only debug access from the VPS shell: curl http://127.0.0.1:3010/api/health
      - "127.0.0.1:3010:3010"
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: aimleads-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
